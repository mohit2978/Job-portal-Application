
spring:
  application:
    name: job-portal-config-server
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/mohit2978/job-portal-config"
          clone-on-start: true
          default-label: master
server:
  port: 8888


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true